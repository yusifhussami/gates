[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gates"
version = "0.1.0"
description = "Regression gates for LLM routing decisions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yusif Hussami" }]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["gates"]
